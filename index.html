<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Indoor Map Prototype</title>
    <link rel="stylesheet" href="Styles.CSS" />
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet Rotate CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tomickigrzegorz/leaflet-rotate@latest/dist/leaflet-rotate.min.css" />
    
    <style>
        #map { width: 100%; height: 100vh; margin: 0; }
        body { margin: 0; padding: 0; overflow: hidden; }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Leaflet Rotate JS -->
    <script src="https://cdn.jsdelivr.net/npm/@tomickigrzegorz/leaflet-rotate@latest/dist/leaflet-rotate.min.js"></script>
    
    <script>
        // 1. Initialize map with rotation enabled natively
        var map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: -2,
            rotate: true,              // Enables native rotation engine
            touchRotate: true,         // Allows two-finger pinch-rotation on mobile
            rotateControl: {
                position: 'topright',  // Adds a neat rotate/compass widget to the corner
                behavior: 'reset'      // Click to reset back to North
            }
        });

        // 2. Define image bounds matching your 4K layout
        var bounds = [[0, 0], [4032, 3024]]; 

        // 3. Add your floor plan image as an overlay
        var image = L.imageOverlay('FirstFloor.png', bounds).addTo(map);

        // 4. Fit map view to the image bounds
        map.fitBounds(bounds);
    </script>
</body>
</html>
