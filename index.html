<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Indoor Map Prototype</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* Make the map fill the whole phone/browser screen */
        #map { width: 100%; height: 100vh; margin: 0; }
        body { margin: 0; padding: 0; }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. Initialize map with simple coordinate system for custom images
        var map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: -2
        });

        // 2. Define image bounds (change numbers based on your image size in pixels)
        var bounds = [[0, 0], [3024, 4032]]; 

        // 3. Add your floor plan image as an overlay
        var image = L.imageOverlay('FirstFloor.png', bounds).addTo(map);

        // 4. Fit map view to the image bounds
        map.fitBounds(bounds);
    </script>
</body>
</html>
