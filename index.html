<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Indoor Map Prototype</title>
    <!-- Link your external CSS file -->
    <link rel="stylesheet" href="Styles.CSS" />
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>

    <div id="map"></div>


   <!-- Leaflet JS Library -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- 1. Core Map Setup -->
    <script src="maplGeneration.js"></script>
    
    <!-- 3. Pathfinding & Routing Logic -->
    <script src="pathfinding.js"></script>

    <script src="facilities.js"></script>
    <!-- Floating Trigger Button -->
    <button id="open-menu-btn">📍 Choose Location</button>

    <!-- Navigation Modal Popup -->
    <div id="location-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Campus Navigation</h2>
                <button id="close-modal-btn">&times;</button>
            </div>

            <!-- Category Tabs -->
            <div class="category-tabs">
                <button class="tab-btn active" onclick="showCategory('shsRooms')">SHS Rooms</button>
                <button class="tab-btn" onclick="showCategory('jhsRooms')">JHS Rooms</button>
                <button class="tab-btn" onclick="showCategory('facilities')">Facilities</button>
                <button class="tab-btn" onclick="showCategory('landmarks')">Landmarks</button>
            </div>

            <!-- Cards Grid Container -->
            <div id="location-cards-grid" class="cards-grid">
                <!-- Dynamic location cards with image placeholders will populate here -->
            </div>
        </div>
    </div>
</body>
</html>
